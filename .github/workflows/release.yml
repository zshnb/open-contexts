name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      SIGNING_MODE: ${{ vars.RELEASE_SIGNING_MODE || 'developer-id' }}
      RELEASE_TAG: ${{ github.ref_name }}
      APP_PATH: dist/OpenContexts.app
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        run: |
          set -euo pipefail
          case "$SIGNING_MODE" in
            developer-id|self-signed|adhoc) ;;
            *) echo "RELEASE_SIGNING_MODE must be developer-id, self-signed, or adhoc" >&2; exit 1 ;;
          esac
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || {
            echo "Tag $RELEASE_TAG does not resolve to workflow commit $GITHUB_SHA" >&2
            exit 1
          }
          python3 -B scripts/test-release-notes.py
          python3 -B scripts/release-notes.py \
            --tag "$RELEASE_TAG" \
            --output dist/release-notes.md
          version="$(tr -d '\r\n' < VERSION)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          cp dist/release-notes.md dist/github-release-notes.md
          if [[ "$SIGNING_MODE" == adhoc ]]; then
            cat >> dist/github-release-notes.md <<'NOTES'

          > **安装提示：** 此版本使用 ad-hoc 签名，未经过 Apple 公证，macOS Gatekeeper 可能阻止直接打开。它仅适合内部测试。
          NOTES
          elif [[ "$SIGNING_MODE" == self-signed ]]; then
            cat >> dist/github-release-notes.md <<'NOTES'

          > **安装提示：** 此版本使用固定的自签名证书，未经过 Apple 公证，macOS Gatekeeper 可能阻止直接打开。从旧版 ad-hoc 签名切换时，辅助功能权限可能需要重新授权一次。
          NOTES
          fi

      - name: Run tests
        run: swift test

      - name: Import release signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          OPENCONTEXTS_CERTIFICATE_P12_BASE64: ${{ secrets.OPENCONTEXTS_CERTIFICATE_P12_BASE64 }}
          OPENCONTEXTS_CERTIFICATE_PASSWORD: ${{ secrets.OPENCONTEXTS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_MODE" == adhoc ]]; then
            echo "CODE_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$SIGNING_MODE" == self-signed ]]; then
            : "${OPENCONTEXTS_CERTIFICATE_P12_BASE64:?Missing OPENCONTEXTS_CERTIFICATE_P12_BASE64 secret}"
            : "${OPENCONTEXTS_CERTIFICATE_PASSWORD:?Missing OPENCONTEXTS_CERTIFICATE_PASSWORD secret}"
            certificate_base64="$OPENCONTEXTS_CERTIFICATE_P12_BASE64"
            certificate_password="$OPENCONTEXTS_CERTIFICATE_PASSWORD"
            identity_pattern='OpenContexts Release Signing'
          else
            : "${APPLE_CERTIFICATE_P12_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64 secret}"
            : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD secret}"
            certificate_base64="$APPLE_CERTIFICATE_P12_BASE64"
            certificate_password="$APPLE_CERTIFICATE_PASSWORD"
            identity_pattern='Developer ID Application:[^"]+'
          fi

          keychain_path="$RUNNER_TEMP/opencontexts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          certificate_path="$RUNNER_TEMP/opencontexts-certificate.p12"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$certificate_base64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$certificate_password" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"

          if [[ "$SIGNING_MODE" == self-signed ]]; then
            certificate_pem="$RUNNER_TEMP/opencontexts-release-certificate.pem"
            security find-certificate -c 'OpenContexts Release Signing' -p "$keychain_path" > "$certificate_pem"
            [[ -s "$certificate_pem" ]] || { echo "Self-signed release certificate missing after import" >&2; exit 1; }
            security add-trusted-cert -r trustRoot -p codeSign -k "$keychain_path" "$certificate_pem"
          fi

          security list-keychains -d user -s "$keychain_path"

          identity_hashes=( $(security find-identity -v -p codesigning "$keychain_path" \
            | sed -En "s/^[[:space:]]*[0-9]+\\)[[:space:]]+([[:xdigit:]]{40})[[:space:]]+\"${identity_pattern}\".*$/\\1/p") )
          if [[ ${#identity_hashes[@]} -ne 1 ]]; then
            echo "Expected exactly one $SIGNING_MODE identity in the release certificate" >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=${identity_hashes[0]}" >> "$GITHUB_ENV"

      - name: Build universal app and DMG
        run: |
          set -euo pipefail
          APP_ARCH=universal \
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          SIGNING_MODE="$SIGNING_MODE" \
          CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            ./scripts/build-app.sh release
          "$APP_PATH/Contents/MacOS/OpenContexts" --self-check
          ./scripts/build-dmg.sh
          echo "DMG_PATH=dist/OpenContexts-${APP_VERSION}-universal.dmg" >> "$GITHUB_ENV"

      - name: Sign, notarize, and verify distribution
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -f "$DMG_PATH" ]] || { echo "Missing DMG: $DMG_PATH" >&2; exit 1; }
          codesign --verify --strict --verbose=2 "$APP_PATH"
          if [[ "$SIGNING_MODE" != developer-id ]]; then
            exit 0
          fi

          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"
          codesign --force --timestamp --sign "$CODE_SIGN_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --timeout 20m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

      - name: Create checksums
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 "$(basename "$DMG_PATH")" > SHA256SUMS.txt
          )

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_ED_PRIVATE_KEY:?Missing SPARKLE_ED_PRIVATE_KEY secret}"
          generate_appcast="$(find -L .build/artifacts -type f -name generate_appcast -print -quit)"
          [[ -n "$generate_appcast" && -x "$generate_appcast" ]] || {
            echo "Sparkle generate_appcast not found in SwiftPM artifacts" >&2
            exit 1
          }
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            swift scripts/check-sparkle-key.swift "$APP_PATH"
          mkdir -p dist/sparkle
          cp "$DMG_PATH" dist/sparkle/
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            dist/sparkle
          mv dist/sparkle/appcast.xml dist/appcast.xml
          signature="$(python3 -B scripts/check-appcast.py \
            dist/appcast.xml "$DMG_PATH" "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
            "$APP_VERSION" \
            "$(plutil -extract CFBundleVersion raw -o - "$APP_PATH/Contents/Info.plist")")"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | \
            "$(dirname "$generate_appcast")/sign_update" --verify --ed-key-file - \
            "$DMG_PATH" "$signature"

      - name: Remove signing material
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/opencontexts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          certificate_path="$RUNNER_TEMP/opencontexts-certificate.p12"
          certificate_pem="$RUNNER_TEMP/opencontexts-release-certificate.pem"
          if [[ -s "$certificate_pem" ]]; then
            security remove-trusted-cert "$certificate_pem" 2>/dev/null || true
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$certificate_path" "$certificate_pem"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          [[ "$remote_sha" == "$GITHUB_SHA" ]] || {
            echo "Remote tag $RELEASE_TAG no longer resolves to workflow commit $GITHUB_SHA" >&2
            exit 1
          }
          release_json="$RUNNER_TEMP/opencontexts-release.json"
          release_error="$RUNNER_TEMP/opencontexts-release-error.txt"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$release_json" 2> "$release_error"; then
            [[ "$(jq -r '.draft' "$release_json")" == true ]] || {
              echo "Release $RELEASE_TAG is already published; refusing to overwrite it" >&2
              exit 1
            }
          else
            grep -q 'HTTP 404' "$release_error" || {
              cat "$release_error" >&2
              exit 1
            }
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "OpenContexts $APP_VERSION" \
              --notes-file dist/github-release-notes.md
          fi

          [[ -s dist/appcast.xml ]] || { echo "Missing appcast.xml" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" \
            "$DMG_PATH" dist/SHA256SUMS.txt dist/appcast.xml --clobber
          gh release edit "$RELEASE_TAG" \
            --title "OpenContexts $APP_VERSION" \
            --notes-file dist/github-release-notes.md \
            --prerelease=false \
            --draft=false
